services:
  api:
    build: .
    image: apimobilidade
    container_name: apimobilidade
    working_dir: /api
    volumes:
      - .:/api
    ports:
      - "3000:3000"
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      - db
    networks:
      - my-network

  db:
    image: postgis/postgis:17-3.5
    container_name: apimobilidade-db
    platform: linux/amd64
    environment:
      POSTGRES_USER: mobilidade
      POSTGRES_PASSWORD: mobilidade_dev_2026
      POSTGRES_DB: mobilidade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network

networks:
  my-network:
    external: true

volumes:
  postgres_data:
