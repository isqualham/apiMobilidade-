services:
  api:
    build: .
    image: apimobilidade
    container_name: apimobilidade
    working_dir: /api

    volumes:
      - .:/api
      - node_modules:/api/node_modules
      - next_cache:/api/.next

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VIAU_ENVIRONMENT: ${VIAU_ENVIRONMENT:-development}

    command: npm run dev -- --hostname 0.0.0.0

    networks:
      - my-network

networks:
  my-network:
    external: true

volumes:
  node_modules:
  next_cache:
